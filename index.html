<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0000ff">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Crypto Wallet</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css?v=20260820104310">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="apple-touch-icon" href="icon-192.png">
</head>

<body>
    <!-- Main Container -->
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="wallet-info">
                <div class="wallet-icon" id="walletIconBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <rect x="4" y="5" width="16" height="14" rx="2.5" stroke="white" stroke-width="2.2" />
                        <path d="M8 9h8" stroke="white" stroke-width="2.2" stroke-linecap="round" />
                        <rect x="8" y="12" width="7" height="3.5" rx="1" fill="white" />
                    </svg>
                </div>
                <span class="wallet-name">Main Wallet 3</span>
            </div>
            <div class="header-actions">
                <button class="icon-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path
                            d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z" />
                    </svg>
                </button>
                <button class="icon-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z" />
                    </svg>
                </button>
            </div>
        </header>

        <!-- Banner -->
        <div class="banner">
            <div class="banner-icon">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="#0099ff">
                    <path d="M12 2c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2zm9 7h-6v13h-2v-6h-2v6H9V9H3V7h18v2z" />
                </svg>
            </div>
            <div class="banner-content">
                <div class="banner-title">Explore Hyperliquid: 200+ markets live</div>
                <div class="banner-subtitle">Explore now</div>
            </div>
        </div>

        <!-- Balance Section -->
        <div class="balance-section">
            <input type="text" class="balance" id="totalBalance" value="$0.00" readonly>
            <div class="balance-change positive" id="balanceChange">
                <i class="fas fa-caret-up"></i>
                <span id="changeAmount">$0.00 (0.00%)</span>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="actions">
            <button class="action-btn">
                <span class="action-icon">
                    <i class="fas fa-arrow-up"></i>
                </span>
                <span class="action-label">Send</span>
            </button>
            <button class="action-btn">
                <span class="action-icon">
                    <i class="fas fa-arrow-down"></i>
                </span>
                <span class="action-label">Receive</span>
            </button>
            <button class="action-btn primary">
                <span class="action-icon">
                    <i class="fas fa-sync-alt"></i>
                </span>
                <span class="action-label">Swap</span>
            </button>
            <button class="action-btn">
                <span class="action-icon">
                    <i class="fas fa-plus"></i>
                </span>
                <span class="action-label">Buy</span>
            </button>
        </div>

        <!-- Tokens Section -->
        <section class="section">
            <div class="section-header">
                <h2>Tokens</h2>
                <i class="fas fa-chevron-right chevron"></i>
            </div>

            <div class="token-item">
                <div class="token-icon bitcoin">
                    <svg width="28" height="28" viewBox="0 0 32 32" fill="white">
                        <path
                            d="M23.189 14.02c.314-2.096-1.283-3.223-3.465-3.975l.708-2.84-1.728-.43-.69 2.765c-.454-.114-.92-.22-1.385-.326l.695-2.783L15.596 6l-.708 2.839c-.376-.086-.746-.17-1.104-.26l.002-.009-2.384-.595-.46 1.846s1.283.294 1.256.312c.7.175.826.638.805 1.006l-.806 3.235c.048.012.11.03.18.057l-.183-.045-1.13 4.532c-.086.212-.303.531-.793.41.018.025-1.256-.313-1.256-.313l-.858 1.978 2.25.561c.418.105.828.215 1.231.318l-.715 2.872 1.727.43.708-2.84c.472.127.93.245 1.378.357l-.706 2.828 1.728.43.715-2.866c2.948.558 5.164.333 6.097-2.333.752-2.146-.037-3.385-1.588-4.192 1.13-.26 1.98-1.003 2.207-2.538zm-3.95 5.538c-.533 2.147-4.148.986-5.32.695l.95-3.805c1.172.293 4.929.872 4.37 3.11zm.535-5.569c-.487 1.953-3.495.96-4.47.717l.86-3.45c.975.243 4.118.696 3.61 2.733z" />
                    </svg>
                </div>
                <div class="token-info">
                    <div class="token-name">Bitcoin</div>
                    <div class="token-amount" id="btcAmount">0.00183188 BTC</div>
                </div>
                <div class="token-value">
                    <div class="value" id="btcValue">$0.00</div>
                    <div class="value-change positive" id="btcChange">+$0.00</div>
                </div>
            </div>

            <button class="view-all-btn">
                View all
                <i class="fas fa-chevron-right"></i>
            </button>
        </section>

        <!-- Perps Section -->
        <section class="section">
            <div class="section-header">
                <h2>Perps</h2>
                <i class="fas fa-chevron-right chevron"></i>
            </div>

            <div class="perps-scroll">
                <div class="perp-card">
                    <div class="perp-header">
                        <div class="perp-icon bitcoin">
                            <svg width="28" height="28" viewBox="0 0 32 32" fill="white">
                                <path
                                    d="M23.189 14.02c.314-2.096-1.283-3.223-3.465-3.975l.708-2.84-1.728-.43-.69 2.765c-.454-.114-.92-.22-1.385-.326l.695-2.783L15.596 6l-.708 2.839c-.376-.086-.746-.17-1.104-.26l.002-.009-2.384-.595-.46 1.846s1.283.294 1.256.312c.7.175.826.638.805 1.006l-.806 3.235c.048.012.11.03.18.057l-.183-.045-1.13 4.532c-.086.212-.303.531-.793.41.018.025-1.256-.313-1.256-.313l-.858 1.978 2.25.561c.418.105.828.215 1.231.318l-.715 2.872 1.727.43.708-2.84c.472.127.93.245 1.378.357l-.706 2.828 1.728.43.715-2.866c2.948.558 5.164.333 6.097-2.333.752-2.146-.037-3.385-1.588-4.192 1.13-.26 1.98-1.003 2.207-2.538zm-3.95 5.538c-.533 2.147-4.148.986-5.32.695l.95-3.805c1.172.293 4.929.872 4.37 3.11zm.535-5.569c-.487 1.953-3.495.96-4.47.717l.86-3.45c.975.243 4.118.696 3.61 2.733z" />
                            </svg>
                        </div>
                        <div class="perp-badge">
                            <i class="fas fa-play"></i>
                        </div>
                    </div>
                    <div class="perp-info">
                        <div class="perp-title">BTC</div>
                        <div class="perp-multiplier">40x</div>
                    </div>
                    <div class="perp-volume" id="btcVolume">$1.48B Vol</div>
                </div>

                <div class="perp-card">
                    <div class="perp-header">
                        <div class="perp-icon ethereum">
                            <i class="fab fa-ethereum"></i>
                        </div>
                        <div class="perp-badge">
                            <i class="fas fa-play"></i>
                        </div>
                    </div>
                    <div class="perp-info">
                        <div class="perp-title">ETH</div>
                        <div class="perp-multiplier">25x</div>
                    </div>
                    <div class="perp-volume" id="ethVolume">$681.74M Vol</div>
                </div>

                <div class="perp-card">
                    <div class="perp-header">
                        <div class="perp-icon hyperliquid">H</div>
                        <div class="perp-badge">
                            <i class="fas fa-play"></i>
                        </div>
                    </div>
                    <div class="perp-info">
                        <div class="perp-title">HYPE</div>
                        <div class="perp-multiplier">20x</div>
                    </div>
                    <div class="perp-volume">$421M Vol</div>
                </div>
            </div>
        </section>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <div class="nav-main">
                <button class="nav-btn active">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
                    </svg>
                </button>
                <button class="nav-btn">
                    <i class="fas fa-chart-line"></i>
                </button>
                <button class="nav-btn">
                    <i class="fas fa-infinity"></i>
                </button>
                <button class="nav-btn">
                    <i class="fas fa-compass"></i>
                </button>
            </div>
            <button class="nav-btn search-btn">
                <i class="fas fa-search"></i>
            </button>
        </nav>

        <!-- Predictions Footer -->
        <div class="predictions-footer">
            <span>Predictions</span>
            <i class="fas fa-chevron-right"></i>
        </div>
    </div>

    <!-- Modal Overlay -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h3>Update Balance</h3>
                <button class="modal-close" id="modalClose">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <label for="walletAmountInput">Enter Wallet Amount (USD)</label>
                <input type="number" id="walletAmountInput" step="0.01" value="118.60" placeholder="0.00">`r`n                <label for="walletAddressInput">From Address</label>`r`n                <input type="text" id="walletAddressInput" value="0x..." placeholder="0x...">
                <div class="modal-info">
                    <i class="fas fa-info-circle"></i>
                    <span>Current: $<span id="currentAmount">118.60</span></span>
                </div>
            </div>
            <div class="modal-footer">
                <button class="modal-btn cancel" id="modalCancel">Cancel</button>
                <button class="modal-btn update" id="modalUpdate">Update</button>
            </div>
        </div>
    </div>

    <!-- Push Notification -->
    <div class="push-notification" id="pushNotification">
        <div class="notification-icon">
            <div class="notification-shield">
                <img src="icon-192.png" alt="Wallet icon" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
                <i class="fas fa-shield-alt"></i>
            </div>
        </div>
        <div class="notification-content">
            <div class="notification-title">Received: <span id="notificationAmount">$0.00 USD</span></div>
            <div class="notification-message">From <span id="notificationAddress">0x...</span></div>
        </div>
    </div>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('Service Worker registered', reg))
                .catch(err => console.log('Service Worker registration failed', err));
        }

        if ('Notification' in window && Notification.permission === 'default') {
            Notification.requestPermission().then(permission => {
                console.log('Notification permission:', permission);
            });
        }

        const formatUsd = (amount, digits = 2) => `$${Number(amount).toLocaleString('en-US', { minimumFractionDigits: digits, maximumFractionDigits: digits })} USD`;

        let btcAmount = 0.00183188;
        let currentBtcPrice = 0;

        const balanceInput = document.getElementById('totalBalance');
        const walletIconBtn = document.getElementById('walletIconBtn');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalClose = document.getElementById('modalClose');
        const modalCancel = document.getElementById('modalCancel');
        const modalUpdate = document.getElementById('modalUpdate');
        const walletAmountInput = document.getElementById('walletAmountInput');
        const currentAmount = document.getElementById('currentAmount');
        const pushNotification = document.getElementById('pushNotification');
        const notificationAmount = document.getElementById('notificationAmount');
        const walletAddressInput = document.getElementById('walletAddressInput');
        const notificationAddress = document.getElementById('notificationAddress');

        walletIconBtn.addEventListener('click', function () {
            walletAmountInput.value = getCurrentWalletAmount().toFixed(2);
            currentAmount.textContent = Number(getCurrentWalletAmount()).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            modalOverlay.classList.add('active');
            walletAmountInput.focus();
        });

        function closeModal() {
            modalOverlay.classList.remove('active');
        }

        modalClose.addEventListener('click', closeModal);
        modalCancel.addEventListener('click', closeModal);
        modalOverlay.addEventListener('click', function (e) {
            if (e.target === modalOverlay) {
                closeModal();
            }
        });

        modalUpdate.addEventListener('click', function () {
            const newWalletAmount = parseFloat(walletAmountInput.value);
            const priceForUpdate = currentBtcPrice > 0 ? currentBtcPrice : 64742;

            if (isNaN(newWalletAmount) || newWalletAmount < 0) {
                walletAmountInput.focus();
                return;
            }

            const oldWalletAmount = btcAmount * priceForUpdate;
            const receivedAmount = Math.abs(newWalletAmount - oldWalletAmount);

            currentBtcPrice = priceForUpdate;
            btcAmount = newWalletAmount / priceForUpdate;

            updateDisplay();
            closeModal();

            setTimeout(function () {
                notificationAmount.textContent = formatUsd(receivedAmount);

                document.body.classList.add('notification-backdrop');
                pushNotification.classList.add('show');

                setTimeout(function () {
                    pushNotification.classList.remove('show');
                    document.body.classList.remove('notification-backdrop');
                }, 5000);

                if ('Notification' in window && Notification.permission === 'granted') {
                    const notification = new Notification('Crypto Wallet', {
                        body: `Received: $${receivedAmount.toFixed(2)}\nFrom 0x...`,
                        icon: 'icon-192.png',
                        badge: 'icon-192.png',
                        tag: 'wallet-received',
                        requireInteraction: false,
                        vibrate: [200, 100, 200]
                    });

                    notification.onclick = function () {
                        window.focus();
                        notification.close();
                    };
                }
            }, 5000);
        });
        function getCurrentWalletAmount() {
            return currentBtcPrice > 0 ? btcAmount * currentBtcPrice : 118.60;
        }

        function updateDisplay() {
            const btcValue = getCurrentWalletAmount();
            balanceInput.value = formatUsd(btcValue);
            document.getElementById('btcAmount').textContent = `${btcAmount.toFixed(8)} BTC`;
            document.getElementById('btcValue').textContent = `$${btcValue.toFixed(2)}`;
        }
        async function fetchCryptoPrices() {
            try {
                const response = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum&vs_currencies=usd&include_24hr_change=true&include_24h_vol=true');
                const data = await response.json();

                const btcPrice = data.bitcoin.usd;
                const btcChange24h = data.bitcoin.usd_24h_change;
                const btcVolume = data.bitcoin.usd_24h_vol;

                currentBtcPrice = btcPrice;

                const ethVolume = data.ethereum.usd_24h_vol;

                const btcValue = btcAmount * btcPrice;

                const previousBtcValue = btcValue / (1 + (btcChange24h / 100));
                const changeInDollars = btcValue - previousBtcValue;
                const changePercentage = btcChange24h;

                document.getElementById('totalBalance').value = `$${btcValue.toFixed(2)}`;
                document.getElementById('btcAmount').textContent = `${btcAmount.toFixed(8)} BTC`;

                const balanceChangeElement = document.getElementById('balanceChange');
                if (btcChange24h >= 0) {
                    balanceChangeElement.className = 'balance-change positive';
                    balanceChangeElement.innerHTML = `<i class="fas fa-caret-up"></i><span id="changeAmount">${formatUsd(changeInDollars, 4)} (${changePercentage.toFixed(2)}%)</span>`;
                } else {
                    balanceChangeElement.className = 'balance-change negative';
                    balanceChangeElement.innerHTML = `<i class="fas fa-caret-down"></i><span id="changeAmount">${formatUsd(Math.abs(changeInDollars), 4)} (${Math.abs(changePercentage).toFixed(2)}%)</span>`;
                }

                document.getElementById('btcValue').textContent = `$${btcValue.toFixed(2)}`;
                document.getElementById('btcChange').textContent = btcChange24h >= 0 ? `+${formatUsd(changeInDollars, 4)}` : `-${formatUsd(Math.abs(changeInDollars), 4)}`;
                document.getElementById('btcChange').className = btcChange24h >= 0 ? 'value-change positive' : 'value-change negative';

                document.getElementById('btcVolume').textContent = `$${(btcVolume / 1e9).toFixed(2)}B Vol`;
                document.getElementById('ethVolume').textContent = `$${(ethVolume / 1e6).toFixed(2)}M Vol`;

            } catch (error) {
                console.error('Error fetching crypto prices:', error);
                document.getElementById('totalBalance').value = '$118.60';
            }
        }

        fetchCryptoPrices();
        setInterval(fetchCryptoPrices, 30000);
    </script>
</body>

</html>
