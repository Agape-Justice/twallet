<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Crypto Wallet</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css?v=20260820104310">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="apple-touch-icon" href="icon-192.png">
</head>

<body>
    <!-- Main Container -->
    <div class="container view active" id="mainView">
        <!-- Header -->
        <header class="header">
            <div class="wallet-info">
                <div class="wallet-icon" id="walletIconBtn" onclick="showView('receivePage')">
                    <img src="wallet-icon.png" class="icon-img wallet-icon-img" alt="wallet">
                </div>
                <span class="wallet-name">Main Wallet 3</span>
            </div>
            <div class="header-actions">
                <button class="icon-btn"><img src="history-icon.png" class="icon-img history-icon-img"
                        alt="history"></button>
                <button class="icon-btn">
                    <svg class="scan-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M7 4H4v3M17 4h3v3M20 17v3h-3M4 17v3h3" fill="none" stroke="currentColor"
                            stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" />
                        <path d="M8 12h8" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" />
                    </svg>
                </button>
            </div>
        </header>

        <!-- Banner -->
        <div class="banner">
            <img src="banner-icon.png" class="banner-icon banner-icon-img" alt="explore">
            <div class="banner-content">
                <div class="banner-title">Explore Hyperliquid: 200+ markets live</div>
                <div class="banner-subtitle">Explore now</div>
            </div>
        </div>

        <!-- Balance Section -->
        <div class="balance-section">
            <input type="text" class="balance" id="totalBalance" value="$0.00" readonly>
            <div class="balance-change positive" id="balanceChange">
                <i class="fas fa-caret-up"></i>
                <span id="changeAmount">$0.00 (0.00%)</span>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="actions">
            <div class="action-wrapper">
                <button class="action-btn" onclick="showView('sendPage')"><span class="action-icon">
                        <i class="fas fa-arrow-up send-outgoing-icon"></i>
                    </span>
                </button>
                <span class="action-label">Send</span>
            </div>
            <div class="action-wrapper">
                <button class="action-btn" onclick="showView('receivePage')"><span class="action-icon">
                        <i class="fas fa-arrow-down"></i>
                    </span>
                </button>
                <span class="action-label">Receive</span>
            </div>
            <div class="action-wrapper">
                <button class="action-btn primary">
                    <span class="action-icon">
                        <i class="fas fa-sync-alt"></i>
                    </span>
                </button>
                <span class="action-label">Swap</span>
            </div>
            <div class="action-wrapper">
                <button class="action-btn">
                    <span class="action-icon">
                        <i class="fas fa-plus"></i>
                    </span>
                </button>
                <span class="action-label">Buy</span>
            </div>
        </div>

        <!-- Tokens Section -->
        <section class="section">
            <div class="section-header">
                <h2>Tokens</h2>
                <i class="fas fa-chevron-right chevron"></i>
            </div>

            <div id="tokensList"></div> <button class="view-all-btn">
                View all
                <i class="fas fa-chevron-right"></i>
            </button>
        </section>

        <!-- Perps Section -->
        <section class="section">
            <div class="section-header">
                <h2>Perps</h2>
                <i class="fas fa-chevron-right chevron"></i>
            </div>

            <div class="perps-scroll">
                <div class="perp-card">
                    <div class="perp-header">
                        <div class="perp-icon bitcoin">
                            <svg width="28" height="28" viewBox="0 0 32 32" fill="white">
                                <path
                                    d="M23.189 14.02c.314-2.096-1.283-3.223-3.465-3.975l.708-2.84-1.728-.43-.69 2.765c-.454-.114-.92-.22-1.385-.326l.695-2.783L15.596 6l-.708 2.839c-.376-.086-.746-.17-1.104-.26l.002-.009-2.384-.595-.46 1.846s1.283.294 1.256.312c.7.175.826.638.805 1.006l-.806 3.235c.048.012.11.03.18.057l-.183-.045-1.13 4.532c-.086.212-.303.531-.793.41.018.025-1.256-.313-1.256-.313l-.858 1.978 2.25.561c.418.105.828.215 1.231.318l-.715 2.872 1.727.43.708-2.84c.472.127.93.245 1.378.357l-.706 2.828 1.728.43.715-2.866c2.948.558 5.164.333 6.097-2.333.752-2.146-.037-3.385-1.588-4.192 1.13-.26 1.98-1.003 2.207-2.538zm-3.95 5.538c-.533 2.147-4.148.986-5.32.695l.95-3.805c1.172.293 4.929.872 4.37 3.11zm.535-5.569c-.487 1.953-3.495.96-4.47.717l.86-3.45c.975.243 4.118.696 3.61 2.733z" />
                            </svg>
                        </div>
                        <img src="perp-badge-icon.png" class="icon-img perp-badge-img" alt="perp">
                    </div>
                    <div class="perp-info">
                        <div class="perp-title">BTC</div>
                        <div class="perp-multiplier">40x</div>
                    </div>
                    <div class="perp-volume" id="btcVolume">$1.48B Vol</div>
                </div>

                <div class="perp-card">
                    <div class="perp-header">
                        <div class="perp-icon ethereum">
                            <i class="fab fa-ethereum"></i>
                        </div>
                        <img src="perp-badge-icon.png" class="icon-img perp-badge-img" alt="perp">
                    </div>
                    <div class="perp-info">
                        <div class="perp-title">ETH</div>
                        <div class="perp-multiplier">25x</div>
                    </div>
                    <div class="perp-volume" id="ethVolume">$681.74M Vol</div>
                </div>

                <div class="perp-card">
                    <div class="perp-header">
                        <div class="perp-icon hyperliquid">H</div>
                        <img src="perp-badge-icon.png" class="icon-img perp-badge-img" alt="perp">
                    </div>
                    <div class="perp-info">
                        <div class="perp-title">HYPE</div>
                        <div class="perp-multiplier">20x</div>
                    </div>
                    <div class="perp-volume">$421M Vol</div>
                </div>
            </div>
        </section>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <div class="nav-main">
                <button class="nav-btn active"><img src="home-icon.png" class="icon-img home-icon-img"
                        alt="home"></button>
                <button class="nav-btn">
                    <svg class="trend-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M4 17l5-5 4 4 7-9" fill="none" stroke="currentColor" stroke-width="2.4"
                            stroke-linecap="round" stroke-linejoin="round" />
                        <path d="M16 7h4v4" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>
                </button>
                <button class="nav-btn">
                    <svg class="infinity-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path
                            d="M5.5 14.5c-2 0-3.5-1.4-3.5-3.2S3.5 8.1 5.5 8.1c3.7 0 5.1 6.4 8.9 6.4 2 0 3.6-1.4 3.6-3.2s-1.6-3.2-3.6-3.2c-3.8 0-5.2 6.4-8.9 6.4z"
                            fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>
                </button>
                <button class="nav-btn">
                    <svg class="compass-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2.2" />
                        <path d="M15.8 8.2l-2 5.6-5.6 2 2-5.6 5.6-2z" fill="currentColor" />
                    </svg>
                </button>
            </div>
            <button class="nav-btn search-btn">
                <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.4" />
                    <path d="M15.5 15.5L21 21" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" />
                </svg>
            </button>
        </nav>

        <!-- Predictions Footer -->
        <div class="predictions-footer">
            <span>Predictions</span>
            <i class="fas fa-chevron-right"></i>
        </div>
    </div>

    <!-- Receive Page -->
    <div id="receivePage" class="view page-view">
        <div class="page-header">
            <button class="page-back" onclick="showView('mainView')">‹</button>
            <h2>Receive</h2>
            <div style="width: 40px;"></div>
        </div>
        <div class="page-body">
            <label for="coinSelect">Select Coin</label>
            <select id="coinSelect">
                <option value="bitcoin">Bitcoin (BTC)</option>
                <option value="ethereum">Ethereum (ETH)</option>
                <option value="solana">Solana (SOL)</option>
                <option value="cardano">Cardano (ADA)</option>
            </select>
            <label for="walletAmountInput">Enter USD Amount</label>
            <input type="number" id="walletAmountInput" step="0.01" value="0" placeholder="0.00">
            <label for="walletAddressInput">From Address</label>
            <input type="text" id="walletAddressInput" value="0x..." placeholder="0x...">
            <div class="modal-info page-info">
                <i class="fas fa-info-circle"></i>
                <span>Total: $<span id="currentAmount">0.00</span></span>
            </div>
            <button class="send-btn" id="modalUpdate" onclick="manualUpdateWallet()">Update</button>
        </div>
    </div>

    <!-- Send Page -->
    <div id="sendPage" class="view page-view">
        <div class="page-header">
            <button class="page-back" onclick="showView('mainView')">‹</button>
            <h2>Send</h2>
            <div style="width: 40px;"></div>
        </div>
        <div class="page-body">
            <label for="sendSelect">Select Coin</label>
            <select id="sendSelect">
                <option value="bitcoin">Bitcoin (BTC)</option>
                <option value="ethereum">Ethereum (ETH)</option>
                <option value="solana">Solana (SOL)</option>
                <option value="cardano">Cardano (ADA)</option>
            </select>
            <label for="sendToAddress">Send To Address</label>
            <input type="text" id="sendToAddress" placeholder="0x...">
            <label for="sendAmount">Amount (USD)</label>
            <input type="number" id="sendAmount" step="0.01" placeholder="0.00">
            <button class="send-btn" onclick="processSend()">Send</button>
        </div>
    </div>

    <!-- Push Notification -->
    <div class="push-notification" id="pushNotification">
        <div class="notification-icon">
            <div class="notification-shield">
                <img src="icon-192.png" alt="Wallet icon"
                    onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
                <i class="fas fa-shield-alt"></i>
            </div>
        </div>
        <div class="notification-content">
            <div class="notification-title">&#x1F4B0; Received: <span id="notificationAmount">$0.00</span></div>
            <div class="notification-message">From <span id="notificationAddress">0x...</span></div>
        </div>
    </div>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('Service Worker registered', reg))
                .catch(err => console.log('Service Worker registration failed', err));
        }

        if ('Notification' in window && Notification.permission === 'default') {
            Notification.requestPermission().then(permission => {
                console.log('Notification permission:', permission);
            });
        }

        const coins = {
            bitcoin: { name: 'Bitcoin', symbol: 'BTC', priceId: 'bitcoin', color: '#f7931a', defaultAmount: 0.00183188 },
            ethereum: { name: 'Ethereum', symbol: 'ETH', priceId: 'ethereum', color: '#627eea', defaultAmount: 0 },
            solana: { name: 'Solana', symbol: 'SOL', priceId: 'solana', color: '#14f195', defaultAmount: 0 },
            cardano: { name: 'Cardano', symbol: 'ADA', priceId: 'cardano', color: '#0033ad', defaultAmount: 0 }
        };

        const defaultPrices = { bitcoin: 64742, ethereum: 3400, solana: 150, cardano: 0.45 };
        let prices = { ...defaultPrices };
        let priceChanges = { bitcoin: 0.53, ethereum: 0, solana: 0, cardano: 0 };

        const formatUsd = (amount, digits = 2) => `$${Number(amount || 0).toLocaleString('en-US', {
            minimumFractionDigits: digits,
            maximumFractionDigits: digits
        })}`;

        const formatCoin = (amount, symbol) => `${Number(amount || 0).toLocaleString('en-US', {
            minimumFractionDigits: 0,
            maximumFractionDigits: 8
        })} ${symbol}`;

        function loadBalances() {
            const saved = localStorage.getItem('walletBalances');
            if (saved) {
                try {
                    return JSON.parse(saved);
                } catch (error) {
                    console.warn('Could not read saved balances', error);
                }
            }
            return {
                bitcoin: { amount: coins.bitcoin.defaultAmount, address: '0x...' }
            };
        }

        let balances = loadBalances();
        let tokenOrder = JSON.parse(localStorage.getItem('walletTokenOrder') || 'null') || Object.keys(balances);
        function saveTokenOrder() {
            localStorage.setItem('walletTokenOrder', JSON.stringify(tokenOrder));
        }
        function moveTokenToTop(coinId) {
            tokenOrder = [coinId, ...tokenOrder.filter(id => id !== coinId)];
            saveTokenOrder();
        }
        if (!balances.bitcoin) {
            balances.bitcoin = { amount: coins.bitcoin.defaultAmount, address: '0x...' };
            localStorage.setItem('walletBalances', JSON.stringify(balances));
        }

        const balanceInput = document.getElementById('totalBalance');
        const tokensList = document.getElementById('tokensList');
        const walletIconBtn = document.getElementById('walletIconBtn');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalClose = document.getElementById('modalClose');
        const modalCancel = document.getElementById('modalCancel');
        const modalUpdate = document.getElementById('modalUpdate');
        const coinSelect = document.getElementById('coinSelect');
        const walletAmountInput = document.getElementById('walletAmountInput');
        const walletAddressInput = document.getElementById('walletAddressInput');
        const currentAmount = document.getElementById('currentAmount');
        const pushNotification = document.getElementById('pushNotification');
        const notificationAmount = document.getElementById('notificationAmount');
        const notificationAddress = document.getElementById('notificationAddress');

        function saveBalances() {
            localStorage.setItem('walletBalances', JSON.stringify(balances));
        }

        function getCoinWorth(coinId) {
            return (balances[coinId]?.amount || 0) * (prices[coinId] || defaultPrices[coinId] || 0);
        }

        function getTotalWorth() {
            return Object.keys(balances).reduce((total, coinId) => total + getCoinWorth(coinId), 0);
        }

        function getTokenIcon(coinId) {
            if (coinId === 'bitcoin') {
                return `<div class="token-icon perp-icon bitcoin"><svg width="36" height="36" viewBox="0 0 32 32" fill="white"><path d="M23.189 14.02c.314-2.096-1.283-3.223-3.465-3.975l.708-2.84-1.728-.43-.69 2.765c-.454-.114-.92-.22-1.385-.326l.695-2.783L15.596 6l-.708 2.839c-.376-.086-.746-.17-1.104-.26l.002-.009-2.384-.595-.46 1.846s1.283.294 1.256.312c.7.175.826.638.805 1.006l-.806 3.235c.048.012.11.03.18.057l-.183-.045-1.13 4.532c-.086.212-.303.531-.793.41.018.025-1.256-.313-1.256-.313l-.858 1.978 2.25.561c.418.105.828.215 1.231.318l-.715 2.872 1.727.43.708-2.84c.472.127.93.245 1.378.357l-.706 2.828 1.728.43.715-2.866c2.948.558 5.164.333 6.097-2.333.752-2.146-.037-3.385-1.588-4.192 1.13-.26 1.98-1.003 2.207-2.538zm-3.95 5.538c-.533 2.147-4.148.986-5.32.695l.95-3.805c1.172.293 4.929.872 4.37 3.11zm.535-5.569c-.487 1.953-3.495.96-4.47.717l.86-3.45c.975.243 4.118.696 3.61 2.733z"/></svg></div>`;
            }
            if (coinId === 'ethereum') {
                return `<div class="token-icon perp-icon ethereum"><i class="fab fa-ethereum"></i></div>`;
            }
            if (coinId === 'solana') {
                return `<div class="token-icon perp-icon solana solana-real-icon"><svg viewBox="0 0 397.7 311.7" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="solanaGradientIcon" x1="360.8791" y1="351.4553" x2="141.213" y2="-69.2936" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#00ffa3"/><stop offset="1" stop-color="#dc1fff"/></linearGradient></defs><path fill="url(#solanaGradientIcon)" d="M64.6 237.9c2.4-2.4 5.7-3.8 9.2-3.8h317.4c5.8 0 8.7 7 4.6 11.1l-62.7 62.7c-2.4 2.4-5.7 3.8-9.2 3.8H6.5c-5.8 0-8.7-7-4.6-11.1l62.7-62.7zM64.6 3.8C67 1.4 70.3 0 73.8 0h317.4c5.8 0 8.7 7 4.6 11.1l-62.7 62.7c-2.4 2.4-5.7 3.8-9.2 3.8H6.5c-5.8 0-8.7-7-4.6-11.1L64.6 3.8zM333.1 120.1c-2.4-2.4-5.7-3.8-9.2-3.8H6.5c-5.8 0-8.7 7-4.6 11.1l62.7 62.7c2.4 2.4 5.7 3.8 9.2 3.8h317.4c5.8 0 8.7-7 4.6-11.1l-62.7-62.7z"/></svg></div>`;
            }
            if (coinId === 'cardano') {
                return `<div class="token-icon perp-icon cardano cardano-logo"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>`;
            }
            const coin = coins[coinId];
            return `<div class="token-icon custom-token" style="background:${coin.color}">${coin.symbol.charAt(0)}</div>`;
        }

        function renderTokens(lastUpdatedCoinId = null) {
            if (lastUpdatedCoinId) moveTokenToTop(lastUpdatedCoinId);
            Object.keys(balances).forEach(coinId => { if (!tokenOrder.includes(coinId)) tokenOrder.push(coinId); });
            tokenOrder = tokenOrder.filter(coinId => balances[coinId]);
            saveTokenOrder();
            const orderedCoinIds = tokenOrder;

            tokensList.innerHTML = orderedCoinIds.map(coinId => {
                const coin = coins[coinId];
                const amount = balances[coinId]?.amount || 0;
                const worth = getCoinWorth(coinId);
                const change = worth * ((priceChanges[coinId] || 0) / 100);
                const changeClass = change >= 0 ? 'positive' : 'negative';
                const changePrefix = change >= 0 ? '+' : '-';

                return `
                    <div class="token-item">
                        ${getTokenIcon(coinId)}
                        <div class="token-info">
                            <div class="token-name">${coin.name}</div>
                            <div class="token-amount">${formatCoin(amount, coin.symbol)}</div>
                        </div>
                        <div class="token-value">
                            <div class="value">${formatUsd(worth)}</div>
                            <div class="value-change ${changeClass}">${changePrefix}${formatUsd(Math.abs(change), 4)}</div>
                        </div>
                    </div>`;
            }).join('');
        }

        function updateDisplay(lastUpdatedCoinId = null) {
            const totalWorth = getTotalWorth();
            balanceInput.value = formatUsd(totalWorth);
            currentAmount.textContent = Number(totalWorth).toLocaleString('en-US', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });

            const totalChange = Object.keys(balances).reduce((total, coinId) => {
                return total + (getCoinWorth(coinId) * ((priceChanges[coinId] || 0) / 100));
            }, 0);
            const totalChangePercent = totalWorth > 0 ? (totalChange / totalWorth) * 100 : 0;
            const balanceChangeElement = document.getElementById('balanceChange');
            const changeClass = totalChange >= 0 ? 'positive' : 'negative';
            const iconClass = totalChange >= 0 ? 'fa-caret-up' : 'fa-caret-down';
            balanceChangeElement.className = `balance-change ${changeClass}`;
            balanceChangeElement.innerHTML = `<i class="fas ${iconClass}"></i><span id="changeAmount">${formatUsd(Math.abs(totalChange), 4)} (${Math.abs(totalChangePercent).toFixed(2)}%)</span>`;

            renderTokens(lastUpdatedCoinId);
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
        }

        function updateModalForCoin() {
            const coinId = coinSelect.value;
            walletAmountInput.value = getCoinWorth(coinId).toFixed(2);
            walletAddressInput.value = balances[coinId]?.address || '0x...';
        }

        if (walletIconBtn && coinSelect && modalClose && modalCancel && modalOverlay) {
            walletIconBtn.addEventListener('click', function () {
                updateModalForCoin();
                currentAmount.textContent = Number(getTotalWorth()).toLocaleString('en-US', {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                });
                modalOverlay.classList.add('active');
                walletAmountInput.focus();
            });

            coinSelect.addEventListener('change', updateModalForCoin);
            modalClose.addEventListener('click', closeModal);
            modalCancel.addEventListener('click', closeModal);
            modalOverlay.addEventListener('click', function (e) {
                if (e.target === modalOverlay) closeModal();
            });
        } else {
            console.error('Missing DOM elements:', {
                walletIconBtn: !!walletIconBtn,
                coinSelect: !!coinSelect,
                modalClose: !!modalClose,
                modalCancel: !!modalCancel,
                modalOverlay: !!modalOverlay
            });
        }

        function showWalletNotification(coinId, amount, worth, address) {
            const coin = coins[coinId];
            const notificationText = ` ${formatCoin(amount, coin.symbol)}`;
            notificationAmount.textContent = notificationText;
            notificationAddress.textContent = address || '0x...';

            document.body.classList.add('notification-backdrop');
            pushNotification.classList.add('show');

            setTimeout(function () {
                pushNotification.classList.remove('show');
                document.body.classList.remove('notification-backdrop');
            }, 5000);

            if ('Notification' in window && Notification.permission === 'granted') {
                const notificationOptions = {
                    body: `💰 Received: ${notificationText}\nFrom ${address || '0x...'}`,
                    icon: 'icon-192.png',
                    badge: 'icon-192.png',
                    tag: 'wallet-received',
                    requireInteraction: true,
                    vibrate: [200, 100, 200]
                };

                if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
                    navigator.serviceWorker.ready.then(registration => {
                        registration.showNotification('💰 Crypto Wallet', notificationOptions);
                    });
                } else {
                    const notification = new Notification('💰 Crypto Wallet', notificationOptions);
                    notification.onclick = function () {
                        window.focus();
                        notification.close();
                    };
                }
            }
        }

        modalUpdate.addEventListener('click', function () {
            const coinId = coinSelect.value;
            const usdAmount = parseFloat(walletAmountInput.value); const coinPrice = prices[coinId] || defaultPrices[coinId] || 1; const amount = usdAmount / coinPrice;
            const address = walletAddressInput.value || '0x...';

            if (isNaN(usdAmount) || usdAmount < 0) {
                walletAmountInput.focus();
                return;
            }

            balances[coinId] = { amount, address };
            saveBalances();
            updateDisplay(coinId);
            closeModal();
            showWalletNotification(coinId, amount, getCoinWorth(coinId), address);
        });

        async function fetchCryptoPrices() {
            try {
                const ids = Object.values(coins).map(coin => coin.priceId).join(',');
                const response = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${ids}&vs_currencies=usd&include_24hr_change=true&include_24h_vol=true`);
                const data = await response.json();

                Object.entries(coins).forEach(([coinId, coin]) => {
                    const coinData = data[coin.priceId];
                    if (coinData && Number.isFinite(coinData.usd)) {
                        prices[coinId] = coinData.usd;
                    }
                    if (coinData && Number.isFinite(coinData.usd_24h_change)) {
                        priceChanges[coinId] = coinData.usd_24h_change;
                    }
                });

                const btcVolume = data.bitcoin?.usd_24h_vol;
                const ethVolume = data.ethereum?.usd_24h_vol;
                document.getElementById('btcVolume').textContent = Number.isFinite(btcVolume) ? `$${(btcVolume / 1e9).toFixed(2)}B Vol` : '$1.48B Vol';
                document.getElementById('ethVolume').textContent = Number.isFinite(ethVolume) ? `$${(ethVolume / 1e6).toFixed(2)}M Vol` : '$681.74M Vol';

                updateDisplay();
            } catch (error) {
                console.error('Error fetching crypto prices:', error);
                updateDisplay();
            }
        }

        updateDisplay();
        fetchCryptoPrices();
        setInterval(fetchCryptoPrices, 30000);

        // Fallback: always allow wallet icon to open modal
        document.addEventListener('DOMContentLoaded', function () {
            const walletBtn = document.getElementById('walletIconBtn');
            const overlay = document.getElementById('modalOverlay');
            const input = document.getElementById('walletAmountInput');
            if (walletBtn && overlay) {
                walletBtn.onclick = function () {
                    overlay.classList.add('active');
                    if (input) input.focus();
                };
            }
        });

        function manualUpdateWallet() {
            const coinId = document.getElementById('coinSelect')?.value || 'bitcoin';
            const amountInput = document.getElementById('walletAmountInput');
            const addressInput = document.getElementById('walletAddressInput');
            const overlay = document.getElementById('modalOverlay');
            const usdAmount = parseFloat(amountInput?.value || "0");
            const price = typeof prices !== "undefined" ? (prices[coinId] || 1) : 1;
            const amount = usdAmount / price;
            const address = addressInput?.value || '0x...';

            if (isNaN(usdAmount) || usdAmount < 0) {
                if (amountInput) amountInput.focus();
                return;
            }

            if (!window.walletBalancesManual) {
                try {
                    window.walletBalancesManual = JSON.parse(localStorage.getItem('walletBalances') || '{}');
                } catch (error) {
                    window.walletBalancesManual = {};
                }
            }

            window.walletBalancesManual[coinId] = { amount, address };
            localStorage.setItem('walletBalances', JSON.stringify(window.walletBalancesManual));

            if (typeof balances !== 'undefined') {
                balances[coinId] = { amount, address };
            }
            if (typeof updateDisplay === 'function') updateDisplay(coinId);
            if (overlay) overlay.classList.remove('active');

            showView('mainView');

            const coin = typeof coins !== 'undefined' ? coins[coinId] : { symbol: coinId.toUpperCase() };
            const worth = usdAmount;
            setTimeout(() => {
                if (typeof showWalletNotification === 'function') {
                    showWalletNotification(coinId, amount, worth, address);
                } else {
                    alert(`💰 Received: ${worth.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} • ${amount} ${coin.symbol}`);
                }
            }, 350);
        }
        function showView(viewId) {
            document.querySelectorAll('.view').forEach(view => view.classList.remove('active'));
            const nextView = document.getElementById(viewId);
            if (nextView) nextView.classList.add('active');
            window.scrollTo(0, 0);
        }

        function processSend() {
            const coinId = document.getElementById('sendSelect')?.value || 'ethereum';
            const usdAmount = parseFloat(document.getElementById('sendAmount')?.value || '0');
            const address = document.getElementById('sendToAddress')?.value || '0x1F9DEf759e4aa6aa4fD691D571d6071e6ed59e0b';
            if (isNaN(usdAmount) || usdAmount <= 0) {
                alert('Please enter a valid amount');
                return;
            }
            const price = prices[coinId] || defaultPrices[coinId] || 1;
            const amount = usdAmount / price;
            sessionStorage.setItem('lastTransaction', JSON.stringify({
                coin: coinId,
                amount: amount,
                usdAmount: usdAmount,
                address: address,
                timestamp: new Date().toISOString()
            }));
            window.location.href = 'sent.html';
        }</script>
